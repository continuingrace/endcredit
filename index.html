<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010"><link rel="manifest" href="manifest.webmanifest"><title>End Credit Letter</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#1b1b1b;--line:#383838;--muted:#aaa;--white:#f4f4f2}
*{box-sizing:border-box}body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--white);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.04em}main{max-width:760px;margin:auto;padding:28px 18px 48px}
h1{font-weight:500;letter-spacing:.22em;font-size:17px;margin:0 0 8px;text-transform:uppercase}.sub{font-size:11px;color:var(--muted);letter-spacing:.12em;margin:0 0 24px;line-height:1.7}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.label{font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
input[type=file],input[type=text],select,button{font:inherit}input[type=text],select{width:100%;background:#111;color:var(--white);border:1px solid #4a4a4a;border-radius:9px;padding:11px;font-size:14px;letter-spacing:.04em}input[type=file]{width:100%;font-size:12px;color:var(--muted)}button{background:var(--white);color:#111;border:0;border-radius:999px;padding:11px 15px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}button.secondary{background:#303030;color:var(--white)}button.danger{background:#432525;color:#fff}button:disabled{opacity:.45}
.hint,.status{color:var(--muted);font-size:11px;line-height:1.65}.status{min-height:18px;margin-top:12px}.video-card{padding:12px;margin-top:14px}.video-title{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.preview{width:100%;max-width:100%;position:relative;background:#050505;border-radius:10px;overflow:hidden;min-height:180px;display:grid;place-items:center;margin:10px 0;touch-action:none;aspect-ratio:2.39/1}.overlay.free{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;max-width:90%;padding:10px}.preview video{display:block;min-width:0;max-width:100%;width:100%;height:100%;object-fit:cover;object-position:50% 50%}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;text-transform:uppercase;flex-direction:column;padding:25px}.overlay.top{justify-content:flex-start;padding-top:12%}.overlay.bottom{justify-content:flex-end;padding-bottom:12%}.overlay.left{align-items:flex-start;text-align:left;justify-content:center}.overlay.right{align-items:flex-end;text-align:right;justify-content:center}.credit,.maintext{line-height:1.05}.grain{position:absolute;inset:-50%;opacity:.055;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");animation:noise .18s steps(2) infinite}@keyframes noise{0%{transform:translate(0,0)}50%{transform:translate(-2%,3%)}100%{transform:translate(-3%,-3%)}}
.controls{display:grid;gap:12px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.threecol{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}input[type=range]{width:100%;accent-color:#f4f4f2}.range-row{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px}.check{width:18px;height:18px;accent-color:#fff}.mini{padding:8px 11px;font-size:9px}@media(max-width:520px){.threecol{grid-template-columns:1fr 1fr}.row{flex-wrap:wrap}}
</style>
</head>
<body><main>
<h1>End Credit Letter</h1><p class="sub">영상마다 다른 텍스트를 넣고, 원하는 영상만 합쳐 저장합니다.</p>
<section class="card"><div class="label">Source videos</div><div class="row"><input id="files" type="file" accept="video/*" multiple><button class="secondary mini" id="addFiles" type="button">Add more videos</button></div><p class="hint">원하는 개수만큼 선택하세요. 선택한 순서대로 표시됩니다. 원본 비율과 색상은 유지합니다.</p><div class="row"><button class="secondary" id="playAll" disabled>Play all previews</button><span id="count" class="hint"></span></div></section>
<section id="videos"></section>
<section class="card"><div class="row"><button id="merge" disabled>Merge selected</button><button id="downloadAll" class="secondary" disabled>Save selected</button></div><div id="status" class="status">영상을 선택하면 편집 카드가 나타납니다.</div><p class="hint">체크한 영상만 병합합니다. 병합은 선택 영상의 비율이 같을 때 가장 정확하게 원본 비율을 유지합니다.</p></section>
</main>
<script>
const $=id=>document.getElementById(id),list=$('videos'),status=$('status');let items=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const keys=['upper','lower','position','x','y','textX','textY','ratio','videoX','videoY','weight','upperSize','lowerSize','upperSpacing','lowerSpacing','rowGap','selected'];const snap=x=>Object.fromEntries(keys.map(k=>[k,x[k]]));const defaults=()=>({upper:'IN SEOUL',lower:'BRAND NEW DAY',position:'free',x:.5,y:.5,textX:.5,textY:.5,ratio:'2.39',videoX:.5,videoY:.5,weight:'700',upperSize:18,lowerSize:34,upperSpacing:5,lowerSpacing:4,rowGap:5,selected:true,url:''});
function card(item,i){const c=document.createElement('section');c.className='card video-card';c.dataset.i=i;c.innerHTML=
'<div class="row"><input class="check" data-k="selected" type="checkbox" checked><div class="video-title">'+esc((i+1)+'. '+item.file.name)+'</div><button class="danger mini" data-action="remove">Remove</button></div>'+
'<div class="preview"><video playsinline controls preload="metadata"></video><div class="overlay"><div class="credit"></div><div class="maintext"></div></div><div class="grain"></div></div>'+
'<div class="controls"><div><div class="label">Upper text</div><input data-k="upper" type="text" maxlength="44"></div><div><div class="label">Lower text</div><input data-k="lower" type="text" maxlength="44"></div>'+
'<div class="twocol"><div><div class="label">Text position</div><select data-k="position"><option value="free">Free drag</option><option value="center">Center</option><option value="top">Top</option><option value="bottom">Bottom</option><option value="left">Left</option><option value="right">Right</option></select></div><div><div class="label">Frame ratio</div><select data-k="ratio"><option value="2.39">Film 2.39:1</option><option value="2.35">Film 2.35:1</option><option value="original">Original</option></select></div></div><div class="twocol"><div><div class="label">Video horizontal</div><input data-k="videoX" type="range" min="0" max="1" step=".01"><div class="range-row"><span>Left</span><span data-out="videoX"></span></div></div><div><div class="label">Video vertical</div><input data-k="videoY" type="range" min="0" max="1" step=".01"><div class="range-row"><span>Top</span><span data-out="videoY"></span></div></div></div><div class="twocol"><div><div class="label">Text horizontal</div><input data-k="textX" type="range" min="0" max="1" step=".01"><div class="range-row"><span>Left</span><span data-out="textX"></span></div></div><div><div class="label">Text vertical</div><input data-k="textY" type="range" min="0" max="1" step=".01"><div class="range-row"><span>Top</span><span data-out="textY"></span></div></div></div><div><div class="label">Font weight</div><select data-k="weight"><option value="400">Regular</option><option value="500">Medium</option><option value="600">Semi bold</option><option value="700">Bold</option></select></div></div>'+
'<div class="threecol"><div><div class="label">Upper size</div><input data-k="upperSize" type="range" min="8" max="48"><div class="range-row"><span>8</span><span data-out="upperSize"></span></div></div><div><div class="label">Lower size</div><input data-k="lowerSize" type="range" min="12" max="80"><div class="range-row"><span>12</span><span data-out="lowerSize"></span></div></div><div><div class="label">Row gap</div><input data-k="rowGap" type="range" min="0" max="32"><div class="range-row"><span>0</span><span data-out="rowGap"></span></div></div></div>'+
'<div class="twocol"><div><div class="label">Upper spacing</div><input data-k="upperSpacing" type="range" min="0" max="18"><div class="range-row"><span>0</span><span data-out="upperSpacing"></span></div></div><div><div class="label">Lower spacing</div><input data-k="lowerSpacing" type="range" min="0" max="18"><div class="range-row"><span>0</span><span data-out="lowerSpacing"></span></div></div></div>'+
'<div class="row"><button class="secondary mini" data-action="undo">Undo</button><button class="secondary mini" data-action="reset">Reset</button><button class="secondary mini" data-action="preview">Preview this video</button><button class="secondary mini" data-action="export">Save this video</button></div></div>';
const v=c.querySelector('video');v.preload='metadata';item.url=URL.createObjectURL(item.file);v.src=item.url;c._item=item;const p=c.querySelector('.preview');let dragging=false;p.addEventListener('pointerdown',e=>{if(e.target.closest('video'))return;dragging=true;p.setPointerCapture(e.pointerId)});p.addEventListener('pointermove',e=>{if(!dragging)return;const r=p.getBoundingClientRect();item.textX=Math.max(.04,Math.min(.96,(e.clientX-r.left)/r.width));item.textY=Math.max(.06,Math.min(.94,(e.clientY-r.top)/r.height));item.x=item.textX;item.y=item.textY;sync(c)});p.addEventListener('pointerup',()=>dragging=false);p.addEventListener('pointercancel',()=>dragging=false);Object.entries(item).forEach(([k,val])=>{const el=c.querySelector('[data-k="'+k+'"]');if(el){if(el.type==='checkbox')el.checked=!!val;else el.value=val}});c.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{item.history=item.history||[];item.history.push(snap(item));if(item.history.length>30)item.history.shift();if(el.type==='checkbox')item[el.dataset.k]=el.checked;else item[el.dataset.k]=el.value;sync(c)}));c.querySelector('[data-action="remove"]').onclick=()=>{URL.revokeObjectURL(item.url);items.splice(i,1);render();};c.querySelector('[data-action="undo"]').onclick=()=>{if(!item.history||!item.history.length)return;Object.assign(item,item.history.pop());render()};c.querySelector('[data-action="reset"]').onclick=()=>{const fresh=defaults();Object.assign(item,fresh,{file:item.file,url:item.url,history:[]});render()};c.querySelector('[data-action="preview"]').onclick=async()=>{list.querySelectorAll('video').forEach(other=>{if(other!==v)other.pause()});await v.play().catch(()=>{});};c.querySelector('[data-action="export"]').onclick=()=>exportVideo(item);list.appendChild(c);sync(c);}
function sync(c){const get=k=>c.querySelector('[data-k="'+k+'"]').value;const o=c.querySelector('.overlay'),p=c.querySelector('.preview'),v=c.querySelector('video');const film=get('ratio')!=='original';p.style.aspectRatio=film?get('ratio')+'/1':'auto';v.style.objectFit=film?'cover':'contain';v.style.objectPosition=(Number(get('videoX'))*100)+'% '+(Number(get('videoY'))*100)+'%';v.style.setProperty('object-position',(Number(get('videoX'))*100)+'% '+(Number(get('videoY'))*100)+'%');o.className='overlay '+get('position');c.querySelector('.credit').textContent=get('upper')||' ';c.querySelector('.maintext').textContent=get('lower')||' ';c.querySelector('.credit').style.fontSize=get('upperSize')+'px';c.querySelector('.maintext').style.fontSize=get('lowerSize')+'px';c.querySelector('.credit').style.letterSpacing=get('upperSpacing')+'px';c.querySelector('.maintext').style.letterSpacing=get('lowerSpacing')+'px';c.querySelector('.credit').style.fontWeight=get('weight');c.querySelector('.maintext').style.fontWeight=get('weight');o.style.gap=get('rowGap')+'px';if(get('position')==='free'){o.style.left=(c._item.textX*100)+'%';o.style.top=(c._item.textY*100)+'%'}['upperSize','lowerSize','rowGap','upperSpacing','lowerSpacing','videoX','videoY','textX','textY'].forEach(k=>c.querySelector('[data-out="'+k+'"]').textContent=get(k)+'px');}
function render(){list.innerHTML='';items.forEach(card);const n=items.length,s=items.filter(x=>x.selected).length;$('count').textContent=n?n+'개 영상 / '+s+'개 선택':'';$('playAll').disabled=!n;$('merge').disabled=s<1;$('downloadAll').disabled=s<1;status.textContent=n?'각 영상의 텍스트와 위치를 따로 설정할 수 있습니다.':'영상을 선택하면 편집 카드가 나타납니다.';}
$('addFiles').onclick=()=> $('files').click();$('files').onchange=e=>{const fresh=[...e.target.files].map(file=>({...defaults(),file}));items.push(...fresh);render();e.target.value='';};
$('playAll').onclick=async()=>{const vs=[...list.querySelectorAll('video')],play=vs.some(v=>v.paused);for(const v of vs){if(play)await v.play().catch(()=>{});else v.pause()}$('playAll').textContent=play?'Pause all previews':'Play all previews';};
$('downloadAll').onclick=()=>items.filter(x=>x.selected).forEach((x,i)=>download(x.url,'end-credit-'+(i+1)+'-'+x.file.name));
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click();}
function chooseMime(){return ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';}
function letter(ctx,text,x,y,size,spacing,align){ctx.font='700 '+size+'px "Helvetica Neue",Arial,sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';if(!spacing){ctx.fillText(text,x,y);return}const chars=[...text],width=chars.reduce((a,ch)=>a+ctx.measureText(ch).width,0)+spacing*(chars.length-1);let px=align==='center'?x-width/2:align==='right'?x-width:x;for(const ch of chars){ctx.fillText(ch,px+ctx.measureText(ch).width/2,y);px+=ctx.measureText(ch).width+spacing;}}
function draw(ctx,w,h,x){ctx.clearRect(0,0,w,h);const vr=x.video.videoWidth/x.video.videoHeight,tr=w/h,sw=tr>vr?x.video.videoWidth:x.video.videoHeight*tr,sh=sw/tr,sx=(x.video.videoWidth-sw)*(x.videoX??.5),sy=(x.video.videoHeight-sh)*(x.videoY??.5);ctx.drawImage(x.video,sx,sy,sw,sh,0,0,w,h);const pos=x.position,align=pos==='left'?'left':pos==='right'?'right':'center';let baseX=align==='left'?w*.08:align==='right'?w*.92:w/2;let y=pos==='top'?h*.18:pos==='bottom'?h*.82:h/2-(Number(x.upperSize)+Number(x.lowerSize)+Number(x.rowGap))/2;if(pos==='free'){baseX=w*(x.textX??x.x??.5);y=h*(x.textY??x.y??.5)-(Number(x.upperSize)+Number(x.lowerSize)+Number(x.rowGap))/2;}ctx.fillStyle='white';ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=5;letter(ctx,(x.upper||'').toUpperCase(),baseX,y,Number(x.upperSize),Number(x.upperSpacing),align);letter(ctx,(x.lower||'').toUpperCase(),baseX,y+Number(x.upperSize)+Number(x.rowGap),Number(x.lowerSize),Number(x.lowerSpacing),align);ctx.shadowBlur=0;}
async function record(itemsToRecord){if(!itemsToRecord.length||!window.MediaRecorder){status.textContent='이 브라우저에서는 영상 저장을 지원하지 않습니다.';return}status.textContent='영상을 만드는 중입니다. 잠시 기다려주세요.';const v=document.createElement('video');v.muted=true;v.playsInline=true;const first=itemsToRecord[0];v.src=first.url;await new Promise(r=>v.onloadedmetadata=r);const ratio=first.ratio==='original'?v.videoWidth/v.videoHeight:Number(first.ratio),h=720,w=Math.round(h*ratio),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d'),stream=canvas.captureStream(30),mime=chooseMime(),rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const done=new Promise(r=>rec.onstop=r);rec.start();for(const x of itemsToRecord){v.src=x.url;await new Promise(r=>{v.onloadedmetadata=r});if(x.ratio!==first.ratio){rec.stop();await done;status.textContent='병합하려면 선택한 영상의 프레임 비율을 같게 맞춰주세요.';return}draw(ctx,w,h,{...x,video:v});await v.play();await new Promise(resolve=>{const step=()=>{draw(ctx,w,h,{...x,video:v});if(v.ended)resolve();else requestAnimationFrame(step)};requestAnimationFrame(step)});v.pause()}rec.stop();await done;const blob=new Blob(chunks,{type:mime||'video/webm'});download(URL.createObjectURL(blob),itemsToRecord.length>1?'end-credit-merged.'+(mime.includes('mp4')?'mp4':'webm'):'end-credit-video.webm');status.textContent='저장이 완료되었습니다.';}
async function exportVideo(x){await record([x]);}
$('merge').onclick=()=>record(items.filter(x=>x.selected));
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
